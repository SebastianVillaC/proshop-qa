# Configuración del análisis estático de SonarQube para ProShop v2
sonar.projectKey=proshop-qa
sonar.projectName=ProShop v2 - QA ITM
sonar.projectVersion=2.0.0
sonar.sourceEncoding=UTF-8

# Código fuente analizado: backend (Express) y frontend (React)
sonar.sources=app/backend,app/frontend/src
sonar.exclusions=**/node_modules/**,app/backend/data/**,app/frontend/build/**,**/*.css

# Pruebas (se reportan como código de prueba, no como fuente)
sonar.tests=tests
sonar.test.inclusions=tests/**/*.js
sonar.test.exclusions=tests/**/node_modules/**

# Cobertura generada por Jest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# La cobertura medida corresponde al backend; el frontend se valida con E2E (Playwright)
sonar.coverage.exclusions=app/frontend/**,app/backend/seeder.js,app/backend/server.js,app/backend/config/**
