name: Reporte de defecto
description: Registrar un defecto encontrado durante las pruebas de ProShop
title: "[DEF-XX] "
labels: ["defecto"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de reportar, verifique que el defecto sea reproducible con los datos semilla (`npm run app:seed`).
        Clasificación de severidad y prioridad: ver `docs/08-gestion-de-defectos.md`.
  - type: input
    id: id
    attributes:
      label: Identificador
      description: Siguiente número libre en .github/defectos.json
      placeholder: DEF-19
    validations:
      required: true
  - type: input
    id: modulo
    attributes:
      label: Módulo / requisito afectado
      placeholder: "Pedidos (API) - RF06"
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: ["Crítico", "Alto", "Medio", "Bajo"]
    validations:
      required: true
  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options: ["P1 - bloqueante", "P2 - iteración actual", "P3 - siguiente iteración", "P4 - backlog"]
    validations:
      required: true
  - type: dropdown
    id: owasp
    attributes:
      label: Categoría OWASP Top 10 (si aplica)
      options: ["No aplica", "A01 Broken Access Control", "A02 Cryptographic Failures", "A03 Injection", "A04 Insecure Design", "A05 Security Misconfiguration", "A06 Vulnerable Components", "A07 Authentication Failures", "A08 Integrity Failures", "A09 Logging Failures", "A10 SSRF"]
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Iniciar sesión como john@email.com
        2. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Evidencia
      description: Capturas, logs, respuesta HTTP o ruta en evidencias/
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      value: "Local - Node 24, MongoDB 7 (Docker), backend :5001, frontend :3000"
  - type: input
    id: caso
    attributes:
      label: Caso de prueba que lo detectó
      placeholder: "CP-13 / E2E-07 / [DEF-xx] en tests/integration/..."
